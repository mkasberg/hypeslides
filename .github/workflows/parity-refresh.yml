name: Parity refresh

# Rebuild Hype in Docker, re-render the parity reference images, reset the
# score baselines, and open a PR with the changes. Hype and Omarchy stay pinned
# in tools/hype-reference/Dockerfile; this workflow is how the pins move.

on:
  workflow_dispatch:
    inputs:
      hype_commit:
        description: "Hype commit to pin (blank keeps the current pin; 'latest' uses omacom/hype's default branch)"
        required: false
        default: ""
      omarchy_commit:
        description: "Omarchy commit to pin (blank keeps the current pin; 'latest' uses basecamp/omarchy's default branch)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: parity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Update pinned commits
        env:
          HYPE_INPUT: ${{ inputs.hype_commit }}
          OMARCHY_INPUT: ${{ inputs.omarchy_commit }}
        run: |
          set -eu
          resolve() { # <input> <repo>
            if [ "$1" = latest ]; then git ls-remote "https://github.com/$2.git" HEAD | cut -f1; else printf '%s' "$1"; fi
          }
          pin() { # <ARG name> <sha>
            echo "$2" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::$1 must be a full 40-character commit sha, got '$2'"; exit 1; }
            old=$(sed -n "s/^ARG $1=//p" tools/hype-reference/Dockerfile)
            sed -i "s/^ARG $1=.*/ARG $1=$2/" tools/hype-reference/Dockerfile
            sed -i "s/$old/$2/g" tools/hype-reference/README.md README.md
          }
          if [ -n "$HYPE_INPUT" ]; then pin HYPE_COMMIT "$(resolve "$HYPE_INPUT" omacom/hype)"; fi
          if [ -n "$OMARCHY_INPUT" ]; then pin OMARCHY_COMMIT "$(resolve "$OMARCHY_INPUT" basecamp/omarchy)"; fi
          grep '^ARG' tools/hype-reference/Dockerfile

      - name: Render references with Hype
        run: tools/parity-refresh.sh

      # The references changed, so reset baselines to today's scores (Playwright
      # runs in its Docker image, which does its own npm ci). A slide
      # count mismatch still fails the run; record it in the PR instead.
      - name: Reset parity baselines
        id: scores
        env:
          PARITY_UPDATE: reset
        run: |
          if tools/playwright-docker.sh --project=parity; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Parity run failed (slide count mismatch?); see the report artifact."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: parity-report/
          if-no-files-found: ignore

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: parity-refresh
          delete-branch: true
          commit-message: Refresh Hype parity references
          title: Refresh Hype parity references
          add-paths: |
            tools/hype-reference/
            tests/parity/reference/
            tests/parity/scores.json
            README.md
          body: |
            Re-rendered `tests/parity/reference/` with Hype in Docker and reset
            `tests/parity/scores.json` to the new scores.

            - Hype commit input: `${{ inputs.hype_commit || '(unchanged)' }}`
            - Omarchy commit input: `${{ inputs.omarchy_commit || '(unchanged)' }}`
            - Parity run: **${{ steps.scores.outputs.status }}**

            Pinned commits are in `tests/parity/reference/manifest.json`. The
            Hype | ours | diff report is attached to the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            🤖 Generated by the `parity-refresh.yml` workflow
