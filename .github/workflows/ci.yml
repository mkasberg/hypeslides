name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Screenshot baselines and parity scores are produced in this exact image
  # (tools/playwright-docker.sh locally), so CI renders identical pixels. Keep
  # the tag in step with @playwright/test in package.json.
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check Playwright image matches package.json
        run: |
          want=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          [ "$want" = 1.65.0 ] || { echo "::error::Update the Playwright image tags in ci.yml to v$want"; exit 1; }
      - run: npm ci
      - run: npx playwright test --project=chromium
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  parity:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test --project=parity
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: parity-report
          path: parity-report/
          if-no-files-found: ignore
