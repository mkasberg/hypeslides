<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d1e2a" />
    <script>
      // Apply the cached app theme before first paint (see src/app/appTheme.ts).
      try {
        var t = JSON.parse(localStorage.getItem('hype-app-theme-tokens') || 'null')
        if (t) for (var k in t) k === 'color-scheme' ? (document.documentElement.style.colorScheme = t[k]) : document.documentElement.style.setProperty('--ui-' + k, t[k])
      } catch (e) {}
    </script>

    <title>Hype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
